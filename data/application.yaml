          - id: long
            label: Full summary (3 paragraphs)
            multiline: true
            value: |-
              I am a Ph.D. student and Leslie A. Geddes Fellow at Purdue University's Weldon School of Biomedical Engineering, co-advised by Dr. Rachel K. Surowiec (Quantitative Biomedical Imaging and Spectroscopy Lab) and Dr. Christopher L. Newman (Indiana University School of Medicine, Riley Hospital for Children). I am concurrently completing an M.S. in Electrical and Computer Engineering at Purdue.

              My research asks how machine learning systems fail, and how to train and evaluate them so that those failures become measurable and fixable. Current threads: failure-composition evaluation of large language models on long-horizon tasks (under review at ICLR 2027), evidence-grounded training for vision-language models (manuscript in final preparation for CVPR 2027), moment-based spiking-to-analog interfaces for event cameras (under review at ICASSP 2027), and generative augmentation for pediatric fracture detection from radiographs.

              Before Purdue I spent three years building production ML and generative-AI systems at Augmedix, IDEEZA, and RadAssist: LoRA fine-tuning of clinical LLMs, Stable Diffusion and ControlNet pipelines, and a 17-finding chest X-ray classifier, all shipped with evaluation loops attached.
