  - id: experience
    title: Work & research experience
    intro: One card per position. Bullets are copied individually or all together as the full description.
    cards:
      - id: purdue_gra
        title: Purdue University — Graduate Research Assistant
        subtitle: Aug 2025 – present · West Lafayette, IN
        open: true
        fields:
          - id: employer
            label: Employer / institution
            value: Purdue University
          - id: department
            label: Department
            value: Weldon School of Biomedical Engineering
          - id: title
            label: Job title
            value: Graduate Research Assistant
          - id: title_long
            label: Job title (with fellowship)
            value: Leslie A. Geddes Fellow and Graduate Research Assistant
          - id: type
            label: Employment type
            value: Research assistantship (graduate)
          - id: location
            label: Location
            value: West Lafayette, Indiana, United States
          - id: start
            label: Start date
            value: August 2025
          - id: start_mmyyyy
            label: Start date (MM/YYYY)
            value: 08/2025
          - id: end
            label: End date
            value: Present
          - id: current
            label: Currently working here?
            value: "Yes"
        bullets:
          - "Long-horizon LLM execution (submitted to ICLR 2027): showed that benchmark accuracy hides how LLMs fail on multi-step deterministic tasks by building an exact-simulator evaluation that separates correct responses from decision errors, state errors, token exhaustion, malformed outputs, and noncompliance, run as 800-sample reasoning-on/off grids on Qwen3 models served through vLLM on dual-GPU nodes, with Clopper–Pearson and clustered uncertainty estimates."
          - "Found that failure composition shifts with scale without a monotonic law: smaller models choose wrong moves while larger models choose correct moves but misreport the resulting state; reasoning mode collapsed move-selection errors from roughly 60% to 0% while leaving state-transcription errors unchanged, and position labels cut Qwen3-4B state errors from 50.6% to 0.6% while adding formatting failures. Replicated on Tower of Hanoi."
          - "Built the harness behind those results: 810 automated tests, SHA-256-pinned verbatim prompts, parser audits, token-budget controls, and resumable detached grid runners for unattended multi-day GPU sweeps."
          - "Vision-language grounding (manuscript in final preparation for CVPR 2027): characterized the “mirage” failure in which VLMs answer confidently from blank or unrelated images, and evaluated TIDE, a training objective pairing each question with its correct image, a blank image requiring refusal, and a same-domain wrong image requiring refusal, with a population-level guarantee that image-blind predictors are suboptimal by at least log 3 nats."
          - "Fine-tuned Qwen3-VL at 2B/4B/8B/32B with 4-bit QLoRA; TIDE was evaluated with LoRA on six VLMs scored by an image-aware judge: blank-image mirage fell to zero on all six and between-model variation on unseen out-of-domain images narrowed from 0.473 to 0.042, while in-domain wrong-image mirage persisted at 27.8–34.8%."
          - "Traced an apparent scale-dependent trend across the model ladder to a projector co-scaling artifact, reporting a documented null result; showed that representation-level grounding alone does not reduce blank-image mirage on converged models."
          - "Dissertation (generative augmentation for rare-lesion detection): designing a mask-conditional latent diffusion model that operates in a VQ-VAE latent space with ControlNet-style conditioning on radiologist-delineated lesion masks, for a regime with only a handful of confirmed abuse cases per center per year; the pipeline couples diffusion augmentation with transformer detection and few-shot classification, after a pilot showed unconditioned diffusion cannot produce coherent skeletal anatomy."
          - "Neuromorphic sensing interfaces (under review at ICASSP 2027): showed that rate readout from leak-free spiking front-ends on event-camera data discards temporal information, and proposed MoHI, a moment-based spiking-to-analog handoff equivariant to affine time warps; perfect accuracy where rate readout stayed at chance (DVS-Gesture, N-MNIST, CIFAR10-DVS)."
          - "Multi-view fusion pilot (manuscript in preparation): showed that naive cross-view max-fusion recovers recall but inflates false positives on normal studies; established the tradeoff as intrinsic at the score level."
          - "Pre-register kill criteria and decision gates before committing GPU budget; IRB-approved clinical data collection with pediatric radiology collaborators at Riley Hospital for Children."
